task_id: 14
name: "diagnose-app-config-error"
prompt: |
  We have deployed a frontend application and a backend service to cluster {{GKE_CLUSTER_NAME}} in project {{GCP_PROJECT_ID}}. However, the frontend application is failing to start and is crashlooping.
  
  First, deploy the current broken state using this manifest:
  ```yaml
  apiVersion: v1
  kind: ConfigMap
  metadata:
    name: frontend-script
    namespace: default
  data:
    server.py: |
      import os
      import urllib.request
      import sys
      import time
      from http.server import HTTPServer, BaseHTTPRequestHandler

      backend_url = os.environ.get("BACKEND_URL")
      print(f"Connecting to backend at {backend_url}...", flush=True)
      
      # Wait a bit for backend to be ready
      time.sleep(2)
      
      try:
          # We try to reach the backend
          urllib.request.urlopen(backend_url, timeout=5)
          print("Successfully connected to backend!", flush=True)
      except Exception as e:
          print(f"CRITICAL: Failed to connect to backend: {e}", flush=True)
          sys.exit(1) # Crash on startup if backend unreachable

      class Handler(BaseHTTPRequestHandler):
          def do_GET(self):
              self.send_response(200)
              self.end_headers()
              self.wfile.write(b"OK")

      print("Starting server on port 8080...", flush=True)
      server = HTTPServer(('0.0.0.0', 8080), Handler)
      server.serve_forever()
  ---
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: backend-api
    namespace: default
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: backend-api
    template:
      metadata:
        labels:
          app: backend-api
      spec:
        containers:
        - name: main
          image: gcr.io/gke-e2e-images/hello-app:1.0
          ports:
          - containerPort: 8080
  ---
  apiVersion: v1
  kind: Service
  metadata:
    name: backend-api-service
    namespace: default
  spec:
    ports:
    - port: 8080
      targetPort: 8080
    selector:
      app: backend-api
  ---
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: frontend-app
    namespace: default
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: frontend-app
    template:
      metadata:
        labels:
          app: frontend-app
      spec:
        containers:
        - name: main
          image: python:3.9-slim
          command: ["python", "/app/server.py"]
          env:
          - name: BACKEND_URL
            value: "http://wrong-backend-service:8080"
          ports:
          - containerPort: 8080
          volumeMounts:
          - name: script-vol
            mountPath: /app
        volumes:
        - name: script-vol
          configMap:
            name: frontend-script
  ```
  
  Your task is to:
  1. Deploy the manifest.
  2. Observe that `frontend-app` is failing/crashlooping.
  3. Inspect the logs of the `frontend-app` pod to diagnose the issue.
  4. Identify that it cannot reach the backend because `BACKEND_URL` is incorrect.
  5. Discover the correct backend service name in the cluster.
  6. Fix the `BACKEND_URL` env var in the `frontend-app` deployment to point to the correct service.
  7. Apply the fix and verify that the `frontend-app` pod starts successfully and stays in Running state.
expected_output: |
  critical requirements:
  - Deploy the initial broken manifest.
  - Detect that the `frontend-app` pod is crashlooping.
  - Retrieve logs for `frontend-app` pod and identify the "CRITICAL: Failed to connect to backend" error.
  - Discover the correct service `backend-api-service` in the cluster.
  - Update `BACKEND_URL` env var in `frontend-app` deployment to `http://backend-api-service:8080`.
  - Apply the updated manifest.
  - Verify the `frontend-app` pod is running successfully without crashing.
